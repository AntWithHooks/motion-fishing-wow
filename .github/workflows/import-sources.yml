name: Import Motion Fishing source archive
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-sources.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack v1.2 source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, lzma, tarfile

          parts_dir = Path(".build/source-parts")
          parts = [parts_dir / f"part{i:02}.txt" for i in range(1,9)]
          if not all(x.is_file() for x in parts):
              raise SystemExit("Missing source archive segments")
          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          payload = base64.b64decode(encoded, validate=True)
          expected = "8cd55b32dc9f5b344da6b7682e0678705a49e93f78b25170779428bb467968c6"
          digest = hashlib.sha256(payload).hexdigest()
          if digest != expected:
              raise SystemExit(f"Archive hash mismatch: {digest} != {expected}")
          data = lzma.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:") as archive:
              members = archive.getmembers()
              if len(members) != 21:
                  raise SystemExit(f"Expected 21 source files, found {len(members)}")
              for m in members:
                  target = Path(m.name)
                  if not m.isfile() or target.is_absolute() or ".." in target.parts:
                      raise SystemExit(f"Unsafe source file: {m.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(m) as src, target.open("wb") as dst:
                      dst.write(src.read())
          print(f"Imported {len(members)} v1.2 source files.")
          PY
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Commit imported source and remove temporary archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .build/source-parts
          git add -A
          git commit -m "feat: publish Motion Fishing v1.2 application sources and tests"
          git push origin HEAD:main
